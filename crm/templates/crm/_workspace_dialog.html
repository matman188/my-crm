<dialog class="order-confirm-dialog" data-workspace-confirm aria-labelledby="workspace-confirm-title" aria-describedby="workspace-confirm-message">
    <h2 id="workspace-confirm-title" data-workspace-confirm-title></h2>
    <p id="workspace-confirm-message" data-workspace-confirm-message></p>
    <div class="button-row order-confirm-actions">
        <button class="button secondary" type="button" data-workspace-cancel autofocus>Cancel</button>
        <button class="button" type="button" data-workspace-accept>Confirm</button>
    </div>
</dialog>
<div class="workspace-toast" data-workspace-toast role="status" hidden></div>
