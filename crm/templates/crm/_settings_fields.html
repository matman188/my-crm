{% for field in fields %}
<div class="form-field{% if field.field.widget.input_type == 'file' or field.field.widget.template_name == 'django/forms/widgets/textarea.html' %} full{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required-marker" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% if field.name == 'invoice_logo' and system_settings.invoice_logo %}<img class="invoice-settings-logo" src="{% url 'invoice_logo' %}" alt="Saved business logo">{% endif %}
    {% if field.help_text %}<span class="helptext">{{ field.help_text }}</span>{% endif %}
    {{ field.errors }}
</div>
{% endfor %}
